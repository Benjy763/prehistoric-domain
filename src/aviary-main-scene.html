<div id="static-loading">
  <img id="loader-logo" class="loader-logo" src="./build/images/prehistoric-domain .png" />
  <div id="loading-infos">AVIARY<br /><span>Fiber 10s | ADSL 2min</span></div>
  <img id="loading-logo" src="./build/images/loading.gif" />
  <div class="vr-buttons">
    <a id="enter" href="#">Start</a>
    <a id="enter-vr" href="#">Start in vr</a>
  </div>
</div>
<div id="main-scene-wrapper">
  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene renderer="foveationLevel: 3; sortObjects: true; precision: medium" background="color: #000"
        embedded="true" vr-mode-ui="enterVRButton: #enter-vr" id="main-scene"
        fog="type: exponential; color: #000;  density: 0.065">
        <!-- All assets -->
        <require path="aviary-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="templates/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="templates/ending.html"></require>
        </a-entity>

        <a-entity id="aviary-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/aviary-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/aviary-scene/lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="templates/aviary-scene/dinosaurs.html"></require>
          <!-- Environment -->
          <require path="templates/aviary-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/aviary-scene/car.html"></require>
        </a-entity>
    </div>
  </div>
</div>
