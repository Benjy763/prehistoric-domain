<a-assets id="swamp-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-swamp1-sound-en" response-type="arraybuffer" src="./build/assets/sounds/voice/en/aviary.mp3"
    preload="auto" volume="1"></audio>
  <audio id="voice-swamp1-sound-fr" response-type="arraybuffer" src="./build/assets/sounds/voice/fr/aviary.mp3"
    preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="./build/assets/sounds/environement/aviary.mp3"
    preload="auto" loop="true" volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="spino-ambiant-1" src="./build/assets/sounds/ptero/ambiant-dinos-1.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="center-asset" src="./build/assets/images/center.png" />
  <img id="loading-asset" src="./build/assets/images/loader.png" />
  <img id="credits-asset" src="./build/assets/images/credits.png" />
  <img id="rendering-asset" src="./build/assets/images/rendering.png" />
  <img id="ground-texture-rock-asset" src="./build/assets/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="./build/assets/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="./build/assets/images/ground-road.jpg" />
  <img id="nopics-asset" src="./build/assets/images/nopics.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="swamp-scene-asset" src="./build/assets/models/objects/swamp-scene/scene.gltf">
  </a-asset-item>
  <a-asset-item id="window-asset" src="./build/assets/models/objects/window/scene.glb">
  </a-asset-item>
  <!-- Environment -->
  <a-asset-item id="tall-bush-asset" src="./build/assets/models/environment/tall-bush/scene.gltf">
  </a-asset-item>
  <a-asset-item id="swamp-rock-asset" src="./build/assets/models/environment/swamp-rock/scene.gltf">
  </a-asset-item>
  <a-asset-item id="swamp-dead-tree-asset" src="./build/assets/models/environment/swamp-dead-tree/scene.gltf">
  </a-asset-item>
  <a-asset-item id="swamp-grass-asset" src="./build/assets/models/environment/swamp-grass/scene.gltf">
  </a-asset-item>
  <a-asset-item id="swamp-trees-asset" src="./build/assets/models/environment/swamp-trees/scene.gltf">
  </a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="spino-male-asset" src="./build/assets/models/dinosaurs/spino-male/Spinosaurus_gltf.gltf">
  </a-asset-item>
  <a-asset-item id="spino-female-asset" src="./build/assets/models/dinosaurs/spino-female/Spinosaurus_gltf.gltf">
  </a-asset-item>

</a-assets>
