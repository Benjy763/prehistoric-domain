<a-assets id="swamp-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-swamp1-sound-en" response-type="arraybuffer" src="./build/assets/sounds/voice/en/aviary.mp3"
    preload="auto" volume="1"></audio>
  <audio id="voice-swamp1-sound-fr" response-type="arraybuffer" src="./build/assets/sounds/voice/fr/aviary.mp3"
    preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="./build/assets/sounds/environement/aviary.mp3"
    preload="auto" loop="true" volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="ptero-ambiant-1" src="./build/assets/sounds/ptero/ambiant-dinos-1.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-ambiant-2" src="./build/assets/sounds/ptero/ambiant-dinos-2.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-ambiant-3" src="./build/assets/sounds/ptero/ambiant-dinos-3.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-ambiant-1" src="./build/assets/sounds/ptero/ambiant-quetza-1.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-ambiant-2" src="./build/assets/sounds/ptero/ambiant-quetza-2.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-passing" src="./build/assets/sounds/ptero/quetza-passing.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-passing" src="./build/assets/sounds/ptero/ptera-passing.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-leave" src="./build/assets/sounds/ptero/quetza-leave.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-walking" src="./build/assets/sounds/ptero/quetza-walking.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-roar1" src="./build/assets/sounds/ptero/quetza-roar-1.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="quetza-roar2" src="./build/assets/sounds/ptero/quetza-roar-2.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="center-asset" src="./build/assets/images/center.png" />
  <img id="loading-asset" src="./build/assets/images/loader.png" />
  <img id="credits-asset" src="./build/assets/images/credits.png" />
  <img id="rendering-asset" src="./build/assets/images/rendering.png" />
  <img id="ground-texture-rock-asset" src="./build/assets/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="./build/assets/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="./build/assets/images/ground-road.jpg" />
  <img id="raptor-pannel-asset" src="./build/assets/images/raptor-sign.png" />
  <img id="nopics-asset" src="./build/assets/images/nopics.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="door-asset" src="./build/assets/models/objects/door-underwater/scene.glb"></a-asset-item>
  <!-- Environment -->
  <a-asset-item id="floor-asset" src="./build/assets/models/environment/floor-iron/scene.gltf"></a-asset-item>
  <a-asset-item id="dome-asset" src="./build/assets/models/environment/dome/scene.glb"></a-asset-item>
  <a-asset-item id="dome-large-asset" src="./build/assets/models/environment/dome-large/scene.gltf"></a-asset-item>
  <a-asset-item id="cage-asset" src="./build/assets/models/environment/cage/scene.glb"></a-asset-item>
  <a-asset-item id="scafold-asset" src="./build/assets/models/environment/scafold/scene.gltf"></a-asset-item>
  <a-asset-item id="wall-asset" src="./build/assets/models/environment/concrete-wall/scene.glb"></a-asset-item>
  <!-- Vegetables -->
  <a-asset-item id="cliff-asset" src="./build/assets/models/environment/cliff/scene.gltf"></a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="pteranodon-asset" src="./build/assets/models/dinosaurs/pteranodon/scene.gltf"></a-asset-item>
  <a-asset-item id="quetza-asset" src="./build/assets/models/dinosaurs/quetzalcoatlus/scene.gltf"></a-asset-item>
</a-assets>
