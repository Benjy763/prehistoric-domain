<a-assets timeout="10000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-gate1-sound-fr" response-type="arraybuffer" src="./build/sounds/voice/fr/gate1.mp3" preload="auto"
    volume="1"></audio>

  <!-- Soundtrack -->
  <audio id="soundtrack-ending-sound" response-type="arraybuffer" src="./build/sounds/soundtrack/ending.mp3"
    preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="./build/sounds/environement/jungle.mp3" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Car -->
  <audio id="car-drive-asset" response-type="arraybuffer" crossorigin="anonymous" src="./build/sounds/car/car-drive.mp3"
    preload="auto" loop="true" volume="1"></audio>

  <!-- Brachio -->
  <a-asset-item id="brachio-step" src="./build/sounds/brachio/brachio-step.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="brachio-roar" src="./build/sounds/brachio/brachio-roar.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="center-asset" src="./build/images/center.png" />
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="credits-asset" src="./build/images/credits.png" />
  <img id="rendering-asset" src="./build/images/rendering.png" />
  <img id="ground-texture-rock-asset" src="./build/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="./build/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="./build/images/ground-road.jpg" />
  <img id="raptor-pannel-asset" src="./build/images/raptor-sign.png" />
  <img id="nopics-asset" src="./build/images/nopics.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <!-- Environment -->
  <!-- Vegetables -->
  <!-- Dinosaurs -->
  <a-asset-item id="brachio-asset" src="./build/models/dinosaurs/brachio/brachio.gltf"></a-asset-item>
</a-assets>
