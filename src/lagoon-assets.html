<a-assets id="lagoon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-lagoon1-sound-en" response-type="arraybuffer" src="./build/sounds/voice/en/lagoon.mp3" preload="auto"
    volume="1"></audio>
  <audio id="voice-lagoon1-sound-fr" response-type="arraybuffer" src="./build/sounds/voice/fr/lagoon.mp3" preload="auto"
    volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="./build/sounds/environement/underwater.mp3" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Images -->
  <img id="center-asset" src="./build/images/center.png" />
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="credits-asset" src="./build/images/credits.png" />
  <img id="rendering-asset" src="./build/images/rendering.png" />
  <img id="ground-texture-rock-asset" src="./build/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="./build/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="./build/images/ground-road.jpg" />
  <img id="nopics-asset" src="./build/images/nopics.jpg" />

  <!-- Sounds -->
  <a-asset-item id="meg-ambiant1" src="./build/sounds/meg/ambiant1.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="meg-bite" src="./build/sounds/meg/bite.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="meg-hit" src="./build/sounds/meg/hit.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="meg-passing" src="./build/sounds/meg/passing.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="door-asset" src="./build/models/objects/door-underwater/scene.glb"></a-asset-item>
  <!-- Environment -->
  <a-asset-item id="floor-asset" src="./build/models/environment/floor-iron/scene.gltf"></a-asset-item>
  <a-asset-item id="dome-asset" src="./build/models/environment/dome/scene.glb"></a-asset-item>
  <a-asset-item id="station-asset" src="./build/models/environment/retrograde-station/scene.glb"></a-asset-item>
  <a-asset-item id="pipe-asset" src="./build/models/environment/air-pipes/scene.gltf"></a-asset-item>
  <a-asset-item id="fishes-asset" src="./build/models/environment/fishes/scene.gltf"></a-asset-item>
  <!-- Vegetables -->
  <a-asset-item id="cliff-asset" src="./build/models/environment/underwater-stone/scene.gltf"></a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="meg-asset" src="./build/models/dinosaurs/megalodon/scene.gltf"></a-asset-item>
  <a-asset-item id="shark-asset" src="./build/models/dinosaurs/hammerhead/scene.gltf"></a-asset-item>
</a-assets>
