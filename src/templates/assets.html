<a-assets timeout="10000">
  <!-- Audio -->
  <audio
    id="gate-sound"
    response-type="arraybuffer"
    src="./build/sounds/gate/gate.mp3"
    preload="auto"
    volume="0.8"
  ></audio>
  <audio
    id="gate-close-sound"
    response-type="arraybuffer"
    src="./build/sounds/gate/gate-close.mp3"
    preload="auto"
    volume="0.6"
  ></audio>
  <audio
    id="cmd-beep-asset"
    response-type="arraybuffer"
    src="./build/sounds/environement/beep.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="cmd-error-asset"
    response-type="arraybuffer"
    src="./build/sounds/environement/error.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="jungle-asset"
    response-type="arraybuffer"
    src="./build/sounds/environement/jungle.mp3"
    preload="auto"
    loop="true"
    volume="0.8"
  ></audio>
  <audio
    id="car-drive-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car/car-drive.mp3"
    preload="auto"
    loop="true"
    volume="1"
  ></audio>
  <audio
    id="car-stop-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car/car-stop.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="sound-mixing-1"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/trex/sound-mixing-1.mp3"
    preload="auto"
    volume="0.7"
  ></audio>
  <audio
    id="leave"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/trex/leave.mp3"
    preload="auto"
    volume="0.5"
  ></audio>
  <a-asset-item
    id="brachio-step"
    src="./build/sounds/brachio/brachio-step.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="brachio-roar"
    src="./build/sounds/brachio/brachio-roar.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="dilo-roar"
    src="./build/sounds/dilo/dilo-roar.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="goat-roar"
    src="./build/sounds/goat/goat.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="goat-elevator"
    src="./build/sounds/goat/elevator.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="trex-roar"
    src="./build/sounds/trex/roar-2.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="trex-foot-step"
    src="./build/sounds/trex/foot-step-3.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="trex-leave"
    src="./build/sounds/trex/leave-2.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>

  <!-- Images -->
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="rendering-asset" src="./build/images/rendering.png" />
  <img id="sky-texture-asset" src="./build/images/background.jpg" />
  <img id="ground-texture-rock-asset" src="./build/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="./build/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="./build/images/ground-road.jpg" />

  <img id="toilet-asset" src="./build/images/toilet.png" />
  <img id="trex-pannel-asset" src="./build/images/trex.png" />
