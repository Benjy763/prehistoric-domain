<a-assets timeout="10000">
  <!-- Audio -->
  <audio
    id="jungle-asset"
    response-type="arraybuffer"
    src="./build/sounds/jungle.mp3"
    preload="auto"
    loop="true"
    volume="0.8"
  ></audio>
  <audio
    id="car-drive-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car-drive.mp3"
    preload="auto"
    loop="true"
    volume="1"
  ></audio>
  <audio
    id="car-stop-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car-stop.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="sound-mixing-1"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/sound-mixing-1.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="sound-mixing-2"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/sound-mixing-2.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="roar"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/roar.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="foot-step-1"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/foot-step-1.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="foot-step-2"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/foot-step-2.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="leave"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/leave.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="benddown"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/benddown.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="bendup"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/bendup.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="snoring"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/snoring.mp3"
    preload="auto"
    volume="1"
  ></audio>

  <!-- Images -->
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="sky-texture-asset" src="./build/images/background.jpg" />
  <img id="ground-texture-asset" src="./build/images/floor.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item
    id="car-asset"
    src="./build/models/objects/car/car.glb"
  ></a-asset-item>
  <a-asset-item
    id="rail-asset"
    src="./build/models/objects/rail/rail.glb"
  ></a-asset-item>
  <!-- <a-asset-itemo
    id="human"
    src="./build/models/objects/human/human.gltf"
  ></a-asset-item> -->

  <!-- Environment -->
  <a-asset-item

  ></a-asset-item>
  <a-asset-item
    id="tunnel-asset"

  <a-asset-item

  ></a-asset-item>
  <a-asset-item

  <a-asset-item

  <a-asset-item

  ></a-asset-item>
  <a-asset-item
    id="simple-tree-asset"
    src="./build/models/environment/simple-tree/simple-tree.gltf"
  ></a-asset-item>
  <a-asset-item
    id="tropical-plant-asset"

  <!-- Dinosaurs -->
  <a-asset-item
    id="trex-asset"

  ></a-asset-item>
