<a-assets timeout="10000">
  <!-- Audio -->
  <audio
    id="cmd-beep-asset"
    response-type="arraybuffer"
    src="./build/sounds/environement/beep.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="cmd-error-asset"
    response-type="arraybuffer"
    src="./build/sounds/environement/error.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="jungle-asset"
    response-type="arraybuffer"
    src="./build/sounds/environement/jungle.mp3"
    preload="auto"
    loop="true"
    volume="0.8"
  ></audio>
  <audio
    id="car-drive-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car/car-drive.mp3"
    preload="auto"
    loop="true"
    volume="1"
  ></audio>
  <audio
    id="car-stop-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car/car-stop.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <a-asset-item
    id="brachio-step"
    src="./build/sounds/brachio/brachio-step.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>
  <a-asset-item
    id="brachio-roar"
    src="./build/sounds/brachio/brachio-roar.mp3"
    preload="auto"
    response-type="arraybuffer"
    crossorigin="anonymous"
  ></a-asset-item>

  <!-- Images -->
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="rendering-asset" src="./build/images/rendering.png" />
  <img id="sky-texture-asset" src="./build/images/background.jpg" />
  <img id="ground-texture-rock-asset" src="./build/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="./build/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="./build/images/ground-road.jpg" />
  <img id="fake-panel-asset" src="./build/images/fake-panel.jpg" />
  <img id="toilet-asset" src="./build/images/toilet.png" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item
    id="car-asset"
    src="./build/models/objects/car/car.glb"
  ></a-asset-item>

  <!-- Dinosaurs -->
  <a-asset-item
    id="brachio-asset"
    src="./build/models/dinosaurs/brachio/brachio.gltf"
  ></a-asset-item>
</a-assets>
