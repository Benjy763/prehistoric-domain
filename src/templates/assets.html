<a-assets timeout="10000">
  <!-- Audio -->
  <audio
    id="jungle-asset"
    response-type="arraybuffer"
    src="./build/sounds/jungle.mp3"
    preload="auto"
    loop="true"
    volume="0.8"
  ></audio>
  <audio
    id="car-drive-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car-drive.mp3"
    preload="auto"
    loop="true"
    volume="1"
  ></audio>
  <audio
    id="car-stop-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car-stop.mp3"
    preload="auto"
    volume="1"
  ></audio>
  <audio
    id="sound-mixing-1"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/sound-mixing-1.mp3"
    preload="auto"
    volume="1"
  ></audio>

  <!-- Images -->
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="sky-texture-asset" src="./build/images/background.jpg" />
  <img id="ground-texture-asset" src="./build/images/floor.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item
    id="car-asset"
    src="./build/models/objects/car/car.glb"
  ></a-asset-item>
  <!-- <a-asset-item
    id="human"
    src="./build/models/objects/human/human.gltf"
  ></a-asset-item> -->

  <!-- Environment -->
  <a-asset-item

  ></a-asset-item>
  <a-asset-item
    id="palm-tree-asset"
    src="./build/models/environment/palm-tree/palm-tree.gltf"
  ></a-asset-item>
  <a-asset-item
    id="double-rock-asset"
    src="./build/models/environment/double-rock/double-rock.gltf"
  ></a-asset-item>
  <a-asset-item
    id="multi-plants-asset"
    src="./build/models/environment/multi-plants/multi-plants.gltf"
  ></a-asset-item>
  <a-asset-item
    id="multi-plants-2-asset"
    src="./build/models/environment/multi-plants-2/multi-plants-2.gltf"
  ></a-asset-item>
  <a-asset-item
    id="palms-asset"

  ></a-asset-item>
  <a-asset-item
