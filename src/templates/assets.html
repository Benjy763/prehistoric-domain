<a-assets timeout="10000">
  <!-- Audio -->
  <audio
    id="jungle-asset"
    response-type="arraybuffer"
    src="./build/sounds/jungle.mp3"
    preload="auto"
    loop="true"
    volume="1"
  ></audio>
  <audio
    id="car-drive-asset"
    response-type="arraybuffer"
    crossorigin="anonymous"
    src="./build/sounds/car-drive.mp3"
    preload="auto"
    loop="true"
    volume="1"
  ></audio>

  <!-- Images -->
  <img id="loading-asset" src="./build/images/loader.png" />
  <img id="sky-texture-asset" src="./build/images/background.jpg" />
  <img id="ground-texture-asset" src="./build/images/floor.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item
    id="car-asset"
    src="./build/models/objects/car/car.glb"
  ></a-asset-item>
  <!-- <a-asset-item
    id="human"
    src="./build/models/objects/human/scene.gltf"
  ></a-asset-item> -->

  <!-- Environment -->
  <a-asset-item
    id="europ-trees-asset"
    src="./build/models/environment/europ-trees/scene.gltf"
  ></a-asset-item>
  <a-asset-item
    id="electric-fence-asset"
    src="./build/models/environment/electric-fence/electric-fence.glb"
  ></a-asset-item>
  <a-asset-item
    id="palm-tree-asset"
    src="./build/models/environment/palm-tree/scene.gltf"
  ></a-asset-item>
  <a-asset-item
    id="double-rock-asset"
    src="./build/models/environment/double-rock/scene.gltf"
  ></a-asset-item>

  <!-- Dinosaurs -->
  <a-asset-item
    id="trex-asset"
    src="./build/models/dinosaurs/trex/scene.gltf"
  ></a-asset-item>
</a-assets>
