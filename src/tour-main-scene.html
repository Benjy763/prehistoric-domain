<div id="static-loading">
  <img id="loader-logo" class="loader-logo" src="./build/images/prehistoric-domain .png" />
  <div id="loading-infos">PREHISTORIC TOUR<br /><span>Fiber 10s | ADSL 2min</span></div>
  <img id="loading-logo" src="./build/images/loading.gif" />
  <div class="vr-buttons">
    <a id="enter" href="#">Start</a>
    <a id="enter-vr" href="#">Start in vr</a>
  </div>
</div>
<div id="main-scene-wrapper">
  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene renderer="foveationLevel: 3; sortObjects: true; precision: medium" background="color: #5e5e5e"
        embedded="true" vr-mode-ui="enterVRButton: #enter-vr" id="main-scene"
        fog="type: exponential; color: #5e5e5e;  density: 0.065">
        <!-- All assets -->
        <require path="tour-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="templates/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="templates/ending.html"></require>
        </a-entity>

        <a-entity id="trex-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/trex-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/trex-scene/lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="templates/trex-scene/dinosaurs.html"></require>
          <!-- Environment -->
          <require path="templates/trex-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/trex-scene/car.html"></require>
        </a-entity>

        <a-entity id="gate-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/gate-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/gate-scene/lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="templates/gate-scene/dinosaurs.html"></require>
          <!-- Environment -->
          <require path="templates/gate-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/gate-scene/car.html"></require>
        </a-entity>

        <a-entity id="dilo-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/dilo-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/dilo-scene/lightning.html"></require>
          <!-- Environment -->
          <require path="templates/dilo-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/dilo-scene/car.html"></require>
        </a-entity>
        <a-entity id="raptor-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/raptor-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/raptor-scene/lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="templates/raptor-scene/dinosaurs.html"></require>
          <!-- Environment -->
          <require path="templates/raptor-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/raptor-scene/car.html"></require>
        </a-entity>
        <a-entity id="trice-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/trice-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/trice-scene/lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="templates/trice-scene/dinosaurs.html"></require>
          <!-- Environment -->
          <require path="templates/trice-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/trice-scene/car.html"></require>
        </a-entity>
      </a-scene>
    </div>
  </div>
</div>
