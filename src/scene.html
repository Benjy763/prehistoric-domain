<div id="static-loading">
  <img src="./build/images/loader.png" />
  <div id="put-headset">Click VR, put your headset and press spacebar</div>
</div>
<a-scene
  id="main-scene"
  stats
  antialias="true"
  fog="type: exponential; color:  #000;  density:  0.022"
>
  <!-- All assets -->
  <require path="templates/assets.html"></require>
  <a-entity id="loading">
    <!-- Loading screnn -->
    <require path="templates/loading.html"></require>
  </a-entity>
  <a-entity id="trex-scene" visible="false">
    <!-- Sky environement -->
    <require path="templates/sky.html"></require>
    <!-- Ground environement -->
    <require path="templates/ground.html"></require>
    <!-- Lightning -->
    <require path="templates/lightning.html"></require>
    <!-- Sound -->
    <require path="templates/global-sound.html"></require>
    <!-- Dinosaurs -->
    <require path="templates/dinosaurs.html"></require>
    <!-- Environment -->
    <require path="templates/environment.html"></require>
    <!-- Objects -->
    <require path="templates/objects.html"></require>
  </a-entity>
</a-scene>
