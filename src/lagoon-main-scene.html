<div id="static-loading">
  <img id="loader-logo" style="display: block" class="loader-logo" src="./build/images/lagoon-illu.jpg" />
  <div id="loading-infos">LAGOON<br /><span class="progress-label">0%</span></div>
  <img id="loading-logo" src="./build/images/loading.gif" />
  <div id="menu-wrapper">
    <!-- <div class="menu">
      <a id="perf" class="buttons-item" href="#">performance</a>
      <a id="quality" class="buttons-item" href="#">quality</a>
    </div> -->
    <div class="menu">
      <a id="language-en" class="buttons-item" href="#">EN</a>
      <a id="language-fr" class="buttons-item" href="#">FR</a>
    </div>
    <div class="menu vr-buttons">
      <a id="enter" class="buttons-item buttons-item-vr" href="#">Start</a>
      <a id="enter-vr" class="buttons-item buttons-item-vr" href="#">Start in vr</a>
    </div>
  </div>
</div>
<div id="main-scene-wrapper">
  <div id="click-wrapper">
    <div class="click-container">
      Press F11 to toggle fullscreen <br />
      Click in the scene to watch</div>
  </div>
  <div id="main-icon" style="display: none">
    <a href="https://www.prehistoricdomain.com/map">
      <img id="loader-logo" class="loader-logo" src="./build/images/prehistoric-domain-main-logo.png" />
    </a>
  </div>
  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene preloader renderer="foveationLevel: 3; sortObjects: true; precision: high" background="color: #000"
        embedded="true" vr-mode-ui="enterVRButton: #enter-vr" id="main-scene"
        fog="type: exponential; color: #000;  density: 0.025">
        <!-- All assets -->
        <require path="lagoon-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="templates/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="templates/ending.html"></require>
        </a-entity>

        <a-entity id="lagoon-scene" visible="false">
          <!-- Ground environement -->
          <require path="templates/lagoon-scene/ground.html"></require>
          <!-- Lightning -->
          <require path="templates/lagoon-scene/lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="templates/lagoon-scene/dinosaurs.html"></require>
          <!-- Environment -->
          <require path="templates/lagoon-scene/environment.html"></require>
          <!-- Objects -->
          <require path="templates/lagoon-scene/car.html"></require>
        </a-entity>
    </div>
  </div>
</div>
