<require path="main-scenes/shared/shared-main-scene.html"></require>
<div id="main-scene-wrapper">
  <require path="main-scenes/shared/shared-context-scene.html"></require>
  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene preloader renderer="foveationLevel: 1; antialias = true; sortObjects: true; precision: high"
        background="color: #2f5b45; transparent: false" embedded="true" vr-mode-ui="enterVRButton: #enter-vr"
        id="main-scene" fog="type: exponential; color: #2f5b45;  density: 0.01; far: 1.03; near: 1.01">
        <!-- All assets -->
        <require path="main-scenes/deinocheirus/deinocheirus-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="components/loading/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="components/ending/ending.html"></require>
        </a-entity>

        <a-entity id="deinocheirus-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/deinocheirus-scene/deinocheirus-ground.html"></require>
          <!-- Lightning -->
          <require path="components/deinocheirus-scene/deinocheirus-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/deinocheirus-scene/deinocheirus-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/deinocheirus-scene/deinocheirus-environment.html"></require>
          <!-- Objects -->
          <require path="components/deinocheirus-scene/deinocheirus-car.html"></require>
        </a-entity>
      </a-scene>
    </div>
  </div>
</div>
