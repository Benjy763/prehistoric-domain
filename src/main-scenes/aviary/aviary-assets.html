<a-assets id="aviary-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-ptera-sound-en" response-type="arraybuffer"
    src="/assets/sounds/voice/en/ptera.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>
  <audio id="voice-ptera-sound-fr" response-type="arraybuffer"
    src="/assets/sounds/voice/fr/ptera.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="coast-asset" response-type="arraybuffer"
    src="/assets/sounds/environement/coast.webm?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" loop="true"
    volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="ptero-fly" src="/assets/sounds/ptero/fly.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-roar" src="/assets/sounds/ptero/roar.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-passing" src="/assets/sounds/ptero/passing.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="ptera-pres-asset" material="shader: flat;encoding: sRGBEncoding;"
    src="/assets/images/ptera-pres.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />


  <img id="loading-asset" src="/assets/images/loader.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="limits-asset" src="/assets/images/limits.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="credits-asset" src="/assets/images/credits.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="rendering-asset" src="/assets/images/rendering.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="nopics-asset" src="/assets/images/nopics.jpg?lastmod=${process.env.UNIQUE_ASSETS_ID}" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="terminal-asset"
    src="/assets/models/objects/terminal/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}">
  </a-asset-item>
  <a-asset-item id="door-asset"
    src="/assets/models/objects/door-2/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/environment/floor-iron/scene.glb"></a-asset-item>
  <a-asset-item id="dome-asset"
    src="/assets/models/environment/dome/scene2.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="checkpoint-asset"
    src="/assets/models/objects/checkpoint/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}">
  </a-asset-item>

  <!-- Environment -->
  <a-asset-item id="coast-model-asset"
    src="/assets/models/environment/coast/coast-scene/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>

  <!-- Vegetation -->
  <a-asset-item id="cliff-asset"
    src="/assets/models/environment/cliff/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="pteranodon-2-asset"
    src="/assets/models/dinosaurs/pteranodon/ptera-2.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
</a-assets>
