<a-assets id="aviary-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-ptera-sound-en" response-type="arraybuffer" src="/assets/sounds/voice/en/ptera.mp3" preload="auto"
    volume="1"></audio>
  <audio id="voice-ptera-sound-fr" response-type="arraybuffer" src="/assets/sounds/voice/fr/ptera.mp3" preload="auto"
    volume="1"></audio>

  <!-- Environement -->
  <audio id="coast-asset" response-type="arraybuffer" src="/assets/sounds/environement/coast.mp3" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="ptero-fly" src="/assets/sounds/ptero/fly.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-roar" src="/assets/sounds/ptero/roar.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="ptero-passing" src="/assets/sounds/ptero/passing.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="ptera-pres-asset" src="/assets/images/ptera-pres.png" />


  <img id="loading-asset" src="/assets/images/loader.png" />
  <img id="limits-asset" src="/assets/images/limits.png" />
  <img id="credits-asset" src="/assets/images/credits.png" />
  <img id="rendering-asset" src="/assets/images/rendering.png" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg" />
  <img id="nopics-asset" src="/assets/images/nopics.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="terminal-asset" src="/assets/models/objects/terminal/scene.glb">
  </a-asset-item>
  <a-asset-item id="door-asset" src="/assets/models/objects/door-2/scene.glb"></a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/environment/floor-iron/scene.gltf"></a-asset-item>
  <a-asset-item id="dome-asset" src="/assets/models/environment/dome/scene2.glb"></a-asset-item>
  <a-asset-item id="checkpoint-asset" src="/assets/models/objects/checkpoint/scene.glb">
  </a-asset-item>

  <!-- Environment -->
  <a-asset-item id="coast-model-asset" src="/assets/models/environment/coast/coast-scene/scene.glb"></a-asset-item>

  <!-- Vegetation -->
  <a-asset-item id="cliff-asset" src="/assets/models/environment/cliff/scene.glb"></a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="pteranodon-2-asset" src="/assets/models/dinosaurs/pteranodon/ptera-2.glb"></a-asset-item>
</a-assets>
