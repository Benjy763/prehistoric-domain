<require path="main-scenes/shared/shared-main-scene.html"></require>
<div id="main-scene-wrapper">
  <div id="click-wrapper">
    <div class="click-container">
      Press F11 to toggle fullscreen <br />
      Click in the scene to watch</div>
  </div>
  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene preloader renderer="foveationLevel: 3; sortObjects: true; precision: high" background="color: #000"
        embedded="true" vr-mode-ui="enterVRButton: #enter-vr" id="main-scene"
        fog="type: exponential; color: #000;  density: 0">
        <!-- All assets -->
        <require path="main-scenes/tour/tour-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="components/loading/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="components/ending/ending.html"></require>
        </a-entity>

        <a-entity id="trex-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/trex-scene/trex-ground.html"></require>
          <!-- Lightning -->
          <require path="components/trex-scene/trex-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/trex-scene/trex-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/trex-scene/trex-environment.html"></require>
          <!-- Objects -->
          <require path="components/trex-scene/trex-car.html"></require>
        </a-entity>

        <a-entity id="gate-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/gate-scene/gate-ground.html"></require>
          <!-- Lightning -->
          <require path="components/gate-scene/gate-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/gate-scene/gate-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/gate-scene/gate-environment.html"></require>
          <!-- Objects -->
          <require path="components/gate-scene/gate-car.html"></require>
        </a-entity>

        <a-entity id="dilo-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/dilo-scene/dilo-ground.html"></require>
          <!-- Lightning -->
          <require path="components/dilo-scene/dilo-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/dilo-scene/dilo-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/dilo-scene/dilo-environment.html"></require>
          <!-- Objects -->
          <require path="components/dilo-scene/dilo-car.html"></require>
        </a-entity>
        <a-entity id="raptor-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/raptor-scene/raptor-ground.html"></require>
          <!-- Lightning -->
          <require path="components/raptor-scene/raptor-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/raptor-scene/raptor-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/raptor-scene/raptor-environment.html"></require>
          <!-- Objects -->
          <require path="components/raptor-scene/raptor-car.html"></require>
        </a-entity>
        <a-entity id="trice-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/trice-scene/trice-ground.html"></require>
          <!-- Lightning -->
          <require path="components/trice-scene/trice-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/trice-scene/trice-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/trice-scene/trice-environment.html"></require>
          <!-- Objects -->
          <require path="components/trice-scene/trice-car.html"></require>
        </a-entity>
      </a-scene>
    </div>
  </div>
</div>
