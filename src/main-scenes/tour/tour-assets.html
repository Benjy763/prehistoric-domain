<a-assets id="tour-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-gate1-sound-fr" response-type="arraybuffer"
    src="/assets/sounds/voice/fr/gate1.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>
  <audio id="voice-gate2-sound-fr" response-type="arraybuffer"
    src="/assets/sounds/voice/fr/gate2.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>

  <audio id="voice-gate4-sound-fr" response-type="arraybuffer"
    src="/assets/sounds/voice/fr/gate4.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>

  <audio id="voice-gate1-sound-en" response-type="arraybuffer"

    src="/assets/sounds/voice/en/gate3.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>
  <audio id="voice-gate4-sound-en" response-type="arraybuffer"
    src="/assets/sounds/voice/en/gate4.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>
  <audio id="voice-gate5-sound-en" response-type="arraybuffer"
    src="/assets/sounds/voice/en/gate5.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>

  <!-- Soundtrack -->
  <audio id="soundtrack-ending-sound" response-type="arraybuffer"

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer"
    src="/assets/sounds/environement/jungle.webm?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" loop="true"
    volume="1"></audio>

  <!-- Car -->
  <audio id="car-drive-asset" response-type="arraybuffer" crossorigin="anonymous"
    src="/assets/sounds/car/car-drive.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" loop="true"
    volume="1"></audio>

    volume="1"></audio>
  <audio id="car-turn-on" response-type="arraybuffer" crossorigin="anonymous"
    src="/assets/sounds/car/turn-on.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>

  <!-- Gate -->
  <a-asset-item id="gate-open" src="/assets/sounds/gate/open.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
