<a-assets id="lagoon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-lagoon1-sound-en" response-type="arraybuffer" src="/assets/sounds/voice/en/lagoon.mp3" preload="auto"
    volume="1"></audio>
  <audio id="voice-lagoon1-sound-fr" response-type="arraybuffer" src="/assets/sounds/voice/fr/lagoon.mp3" preload="auto"
    volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="/assets/sounds/environement/underwater.webm" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Images -->
  <img id="lagoon-pres-asset" src="/assets/images/meg-pres.png" />

  <img id="loading-asset" src="/assets/images/loader.png" />
  <img id="limits-asset" src="/assets/images/limits.png" />
  <img id="credits-asset" src="/assets/images/credits.png" />
  <img id="rendering-asset" src="/assets/images/rendering.png" />
  <img id="ground-texture-rock-asset" src="/assets/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg" />
  <img id="ground-road-texture-asset" src="/assets/images/ground-road.jpg" />
  <img id="nopics-asset" src="/assets/images/nopics.jpg" />

  <!-- Sounds -->
  <a-asset-item id="meg-ambiant1" src="/assets/sounds/meg/ambiant1.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="meg-bite" src="/assets/sounds/meg/bite.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="meg-hit" src="/assets/sounds/meg/hit.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="meg-passing" src="/assets/sounds/meg/passing.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="terminal-asset" src="/assets/models/objects/terminal/scene.glb?lastmod=8">
  </a-asset-item>
  <a-asset-item id="door-asset" src="/assets/models/objects/door-underwater/scene.glb?lastmod=8"></a-asset-item>
  <!-- Environment -->
  <a-asset-item id="floor-asset" src="/assets/models/environment/floor-iron/scene.gltf"></a-asset-item>
  <a-asset-item id="dome-asset" src="/assets/models/environment/dome/scene.glb?lastmod=8"></a-asset-item>
  <a-asset-item id="station-asset"
    src="/assets/models/environment/retrograde-station/scene.glb?lastmod=8"></a-asset-item>
  <a-asset-item id="pipe-asset" src="/assets/models/environment/air-pipes/scene.glb?lastmod=8"></a-asset-item>
  <a-asset-item id="fishes-asset" src="/assets/models/environment/underwater/fishes/scene.glb?lastmod=8"></a-asset-item>
  <!-- Vegetables -->
  <a-asset-item id="cliff-asset"
    src="/assets/models/environment/underwater/underwater-stone/scene.glb?lastmod=8"></a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="meg-asset" src="/assets/models/dinosaurs/megalodon/scene.glb?lastmod=8"></a-asset-item>
  <a-asset-item id="shark-asset" src="/assets/models/dinosaurs/sword-fish/scene.glb?lastmod=8"></a-asset-item>
  <a-asset-item id="checkpoint-asset" src="/assets/models/objects/checkpoint/scene.glb?lastmod=8">
  </a-asset-item>
</a-assets>
