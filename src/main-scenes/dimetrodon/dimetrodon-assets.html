<a-assets id="dimetrodon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-dimetrodon1-sound-en" response-type="arraybuffer" src="/assets/sounds/voice/en/aviary.mp3"
    preload="auto" volume="1"></audio>
  <audio id="voice-dimetrodon1-sound-fr" response-type="arraybuffer" src="/assets/sounds/voice/fr/aviary.mp3"
    preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="/assets/sounds/environement/aviary.mp3" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="dimetrodon-ambiant-1" src="/assets/sounds/ptero/ambiant-dinos-1.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="center-asset" src="/assets/images/center.png" />
  <img id="loading-asset" src="/assets/images/loader.png" />
  <img id="credits-asset" src="/assets/images/credits.png" />
  <img id="rendering-asset" src="/assets/images/rendering.png" />
  <img id="dont-touch-asset" src="/assets/images/dont-touch.jpg" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="dimetrodon-scene-asset" src="/assets/models/objects/viewing-gallery/scene.glb">
  </a-asset-item>
  <a-asset-item id="window-asset" src="/assets/models/objects/window/scene.glb">
  </a-asset-item>
  <a-asset-item id="window-support-asset" src="/assets/models/objects/window-support/scene.glb">
  </a-asset-item>
  <a-asset-item id="wall-asset" src="/assets/models/objects/door-2/scene.gltf">
  </a-asset-item>
  <a-asset-item id="terminal-asset" src="/assets/models/objects/terminal/scene.gltf">
  </a-asset-item>
  <a-asset-item id="door-asset" src="/assets/models/objects/door-underwater/scene.glb">
  </a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/objects/floor/scene.gltf">
  </a-asset-item>

  <!-- Environment -->
  <a-asset-item id="desert-scene-asset" src="/assets/models/environment/desert/desert-scene/scene.glb"></a-asset-item>
  </a-asset-item>
  <a-asset-item id=" desert-plant-asset" src="/assets/models/environment/desert/desert-plant/scene.gltf">

  <a-asset-item id="desert-branch-asset" src="/assets/models/environment/desert/desert-branch/scene.gltf">
  </a-asset-item>
  <a-asset-item id="desert-rock-asset" src="/assets/models/environment/desert/desert-rock/scene.gltf">

  <a-asset-item id="dimetrodon-asset" src="/assets/models/dinosaurs/dimetrodon/scene.gltf">

  </a-asset-item>
  <a-asset-item id="rabbit-asset" src="/assets/models/dinosaurs/rabbit/scene.glb">
  </a-asset-item>

  <img id="dimetrodon-pres-asset" src="/assets/images/spino-pres.png" />
