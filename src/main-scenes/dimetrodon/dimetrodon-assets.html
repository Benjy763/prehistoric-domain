<a-assets id="dimetrodon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-dimetrodon1-sound-en" response-type="arraybuffer" src="/assets/sounds/voice/en/aviary.mp3"
    preload="auto" volume="1"></audio>
  <audio id="voice-dimetrodon1-sound-fr" response-type="arraybuffer" src="/assets/sounds/voice/fr/aviary.mp3"
    preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="desert-asset" response-type="arraybuffer" src="/assets/sounds/environement/desert.mp3" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="dimetrodon-dime-attack" src="/assets/sounds/dimetrodon/dime-attack.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="dimetrodon-dime-move" src="/assets/sounds/dimetrodon/dime-move.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="dimetrodon-dime-run" src="/assets/sounds/dimetrodon/dime-run.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="dimetrodon-dime-walk" src="/assets/sounds/dimetrodon/dime-walk.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="dimetrodon-dime-roar" src="/assets/sounds/dimetrodon/dime-roar.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="dimetrodon-rabbit-cry" src="/assets/sounds/dimetrodon/rabbit-cry.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="dimetrodon-rabbit-walk" src="/assets/sounds/dimetrodon/rabbit-walk.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->


  <img id="loading-asset" src="/assets/images/loader.png" />
  <img id="limits-asset" src="/assets/images/limits.png" />
  <img id="credits-asset" src="/assets/images/credits.png" />
  <img id="rendering-asset" src="/assets/images/rendering.png" />
  <img id="dont-touch-asset" src="/assets/images/dont-touch.jpg" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="dimetrodon-scene-asset" src="/assets/models/objects/viewing-gallery/scene.glb">
  </a-asset-item>
  <a-asset-item id="window-asset" src="/assets/models/objects/window/scene.glb">
  </a-asset-item>
  <a-asset-item id="window-support-asset" src="/assets/models/objects/window-support/scene.glb">
  </a-asset-item>
  <a-asset-item id="wall-asset" src="/assets/models/objects/door-2/scene.glb">
  </a-asset-item>
  <a-asset-item id="terminal-asset" src="/assets/models/objects/terminal/scene.glb">
  </a-asset-item>
  <a-asset-item id="door-asset" src="/assets/models/objects/door-underwater/scene.glb">
  </a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/objects/floor/scene.glb">
  </a-asset-item>
  <a-asset-item id="checkpoint-asset" src="/assets/models/objects/checkpoint/scene.glb">
  </a-asset-item>

  <!-- Environment -->
  <a-asset-item id="desert-scene-asset" src="/assets/models/environment/desert/desert-scene/scene2.glb"></a-asset-item>
  </a-asset-item>
  <a-asset-item id=" desert-plant-asset" src="/assets/models/environment/desert/desert-plant/scene.glb">
  </a-asset-item>
  <a-asset-item id="desert-branch-asset" src="/assets/models/environment/desert/desert-branch/scene.glb">
  </a-asset-item>
  <a-asset-item id="desert-rock-asset" src="/assets/models/environment/desert/desert-rock/scene.glb">
  </a-asset-item>


  <!-- Dinosaurs -->
  <a-asset-item id="dimetrodon-asset" src="/assets/models/dinosaurs/dimetrodon/scene.glb">
  </a-asset-item>
  <a-asset-item id="dimetrodon-sail-asset" src="/assets/models/dinosaurs/dimetrodon/scene2.glb">
  </a-asset-item>
  <a-asset-item id="dimetrodon-female-asset" src="/assets/models/dinosaurs/dimetrodon-female/scene.glb">
  </a-asset-item>
  <a-asset-item id="rabbit-asset" src="/assets/models/dinosaurs/rabbit/scene.glb">
  </a-asset-item>

  <!-- Images -->
  <img id="dimetrodon-pres-asset" src="/assets/images/dimetrodon-pres.png" />
