<a-assets id="cretaceous-lagoon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-lagoon1-sound-en" response-type="arraybuffer" src="/assets/sounds/voice/en/lagoon.mp3" preload="auto"
    volume="1"></audio>
  <audio id="voice-lagoon1-sound-fr" response-type="arraybuffer" src="/assets/sounds/voice/fr/lagoon.mp3" preload="auto"
    volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="/assets/sounds/environement/underwater.webm" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Images -->
  <img id="cretaceous-lagoon-pres-asset" src="/assets/images/meg-pres.png?lastmod=${uniqueAssetsId}" />

  <img id="loading-asset" src="/assets/images/loader.png?lastmod=${uniqueAssetsId}" />
  <img id="limits-asset" src="/assets/images/limits.png?lastmod=${uniqueAssetsId}" />
  <img id="credits-asset" src="/assets/images/credits.png?lastmod=${uniqueAssetsId}" />
  <img id="rendering-asset" src="/assets/images/rendering.png?lastmod=${uniqueAssetsId}" />
  <img id="ground-texture-rock-asset" src="/assets/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg?lastmod=${uniqueAssetsId}" />
  <img id="ground-road-texture-asset" src="/assets/images/ground-road.jpg" />
  <img id="nopics-asset" src="/assets/images/nopics.jpg?lastmod=${uniqueAssetsId}" />

  <!-- Sounds -->
  <a-asset-item id="mosasaur-bite" src="/assets/sounds/meg/bite.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="mosasaur-passing" src="/assets/sounds/meg/passing.mp3" preload="auto" response-type="arraybuffer"
    crossorigin="anonymous"></a-asset-item>

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="terminal-asset" src="/assets/models/objects/terminal/scene.glb?lastmod=${uniqueAssetsId}">
  </a-asset-item>
  <a-asset-item id="door-asset"
    src="/assets/models/objects/door-underwater/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="base-asset" src="/assets/models/objects/base/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <!-- Environment -->
  <a-asset-item id="particles-asset"
    src="/assets/models/environment/particles/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/environment/floor-iron/scene.gltf"></a-asset-item>
  <a-asset-item id="dome-asset"
    src="/assets/models/environment/dome/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="station-asset"
    src="/assets/models/environment/retrograde-station/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="pipe-asset"
    src="/assets/models/environment/air-pipes/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <!-- Vegetation -->
  <!-- Dinosaurs -->
  <a-asset-item id="amonite-asset"
    src="/assets/models/dinosaurs/amonite/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="plesiosaur-asset"
    src="/assets/models/dinosaurs/plesiosaur/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="ichthyosaur-asset"
    src="/assets/models/dinosaurs/ichthyosaur/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="mosasaur-asset"
    src="/assets/models/dinosaurs/mosasaur/scene.glb?lastmod=${uniqueAssetsId}"></a-asset-item>
  <a-asset-item id="checkpoint-asset" src="/assets/models/objects/checkpoint/scene.glb?lastmod=${uniqueAssetsId}">
  </a-asset-item>
</a-assets>
