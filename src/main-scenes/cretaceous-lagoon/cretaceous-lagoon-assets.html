<a-assets id="cretaceous-lagoon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-lagoon1-sound-en" response-type="arraybuffer"
    src="/assets/sounds/voice/en/cretaceous-lagoon.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    volume="1"></audio>
  <audio id="voice-lagoon1-sound-fr" response-type="arraybuffer"
    src="/assets/sounds/voice/fr/cretaceous-lagoon.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer"
    src="/assets/sounds/environement/underwater.webm?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" loop="true"
    volume="1"></audio>

  <!-- Images -->
  <img id="cretaceous-lagoon-pres-asset" material="shader: flat;encoding: sRGBEncoding;"
    src="/assets/images/cretaceous-pres.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />

  <img id="loading-asset" src="/assets/images/loader.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="limits-asset" src="/assets/images/limits.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="credits-asset" src="/assets/images/credits.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="rendering-asset" src="/assets/images/rendering.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="ground-texture-rock-asset" src="/assets/images/floor-rock.jpg" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="ground-road-texture-asset" src="/assets/images/ground-road.jpg" />
  <img id="nopics-asset" src="/assets/images/nopics.jpg?lastmod=${process.env.UNIQUE_ASSETS_ID}" />

  <!-- Sounds -->
  <a-asset-item id="mosasaur-bite" src="/assets/sounds/mosasaur/bite.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="mosasaur-passing" src="/assets/sounds/meg/passing.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="mosasaur-roar" src="/assets/sounds/mosasaur/roar.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="plesiosaur-bubble"
    src="/assets/sounds/plesiosaur/bubble.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="plesiosaur-passing"
    src="/assets/sounds/plesiosaur/passing.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="plesiosaur-passing-2"
    src="/assets/sounds/plesiosaur/passing-2.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="terminal-asset"
    src="/assets/models/objects/terminal/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}">
  </a-asset-item>
  <a-asset-item id="door-asset"
    src="/assets/models/objects/door-underwater/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="base-asset"
    src="/assets/models/objects/base/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <!-- Environment -->
  <a-asset-item id="particles-asset"
    src="/assets/models/environment/particles/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/environment/floor-iron/scene.glb"></a-asset-item>
  <a-asset-item id="dome-asset"
    src="/assets/models/environment/dome/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="station-asset"
    src="/assets/models/environment/retrograde-station/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="pipe-asset"
    src="/assets/models/environment/air-pipes/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <!-- Vegetation -->
  <a-asset-item id="rock-asset"
    src="/assets/models/environment/underwater/underwater-stone-2/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <!-- Dinosaurs -->
  <a-asset-item id="amonite-asset"
    src="/assets/models/dinosaurs/amonite/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="plesiosaur-asset"
    src="/assets/models/dinosaurs/plesiosaur/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="ichthyosaur-asset"
    src="/assets/models/dinosaurs/ichthyosaur/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="mosasaur-asset"
    src="/assets/models/dinosaurs/mosasaur/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}"></a-asset-item>
  <a-asset-item id="checkpoint-asset"
    src="/assets/models/objects/checkpoint/scene.glb?lastmod=${process.env.UNIQUE_ASSETS_ID}">
  </a-asset-item>
</a-assets>
