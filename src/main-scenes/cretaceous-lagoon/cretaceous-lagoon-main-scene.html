<require path="main-scenes/shared/shared-main-scene.html"></require>
<div id="main-scene-wrapper">
  <require path="main-scenes/shared/shared-context-scene.html"></require>

  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene preloader
        renderer="colorManagement: false;foveationLevel: 1; antialias: false; sortTransparentObjects: true; precision: high"
        background="color: #197cae; transparent: false" embedded="true" xr-mode-ui="enterVRButton: #enter-vr"
        id="main-scene" fog="type: exponential; color: #197cae;  density: 0; far: 1.03; near: 1.01">
        <!-- All assets -->
        <require path="main-scenes/cretaceous-lagoon/cretaceous-lagoon-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="components/loading/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="components/ending/ending.html"></require>
        </a-entity>

        <a-entity id="cretaceous-lagoon-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/cretaceous-lagoon-scene/cretaceous-lagoon-ground.html"></require>
          <!-- Lightning -->
          <require path="components/cretaceous-lagoon-scene/cretaceous-lagoon-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/cretaceous-lagoon-scene/cretaceous-lagoon-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/cretaceous-lagoon-scene/cretaceous-lagoon-environment.html"></require>
          <!-- Objects -->
          <require path="components/cretaceous-lagoon-scene/cretaceous-lagoon-car.html"></require>
        </a-entity>
    </div>
  </div>
</div>
