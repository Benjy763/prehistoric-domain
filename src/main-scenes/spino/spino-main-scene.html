<require path="main-scenes/shared/shared-main-scene.html"></require>
<div id="main-scene-wrapper">
  <require path="main-scenes/shared/shared-context-scene.html"></require>

  <div class="scene-border-inner">
    <div id="main-scene-content" class="scene-content">
      <a-scene preloader renderer="foveationLevel: 1; antialias = true; sortObjects: false; precision: high"
        background="color: #197cae; transparent: false" embedded="true" vr-mode-ui="enterVRButton: #enter-vr"
        id="main-scene" fog="type: exponential; color: #197cae;  density: 0; far: 1.03; near: 1.01">
        <!-- All assets -->
        <require path="main-scenes/spino/spino-assets.html"></require>

        <!-- Loading scene -->
        <a-entity id="loading-scene">
          <require path="components/loading/loading.html"></require>
        </a-entity>
        <a-entity id="ending-scene" visible="false">
          <require path="components/ending/ending.html"></require>
        </a-entity>

        <a-entity id="spino-scene" visible="false">
          <!-- Ground environement -->
          <require path="components/spino-scene/spino-ground.html"></require>
          <!-- Lightning -->
          <require path="components/spino-scene/spino-lightning.html"></require>
          <!-- Dinosaurs -->
          <require path="components/spino-scene/spino-dinosaurs.html"></require>
          <!-- Environment -->
          <require path="components/spino-scene/spino-environment.html"></require>
          <!-- Objects -->
          <require path="components/spino-scene/spino-car.html"></require>
        </a-entity>
    </div>
  </div>
</div>
