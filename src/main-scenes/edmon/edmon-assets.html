<a-assets id="edmon-assets" timeout="60000">
  <!-- Audio -->
  <!-- Voice -->
  <audio id="voice-edmon1-sound-en" response-type="arraybuffer" src="/assets/sounds/voice/en/aviary.mp3" preload="auto"
    volume="1"></audio>
  <audio id="voice-edmon1-sound-fr" response-type="arraybuffer" src="/assets/sounds/voice/fr/aviary.mp3" preload="auto"
    volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer" src="/assets/sounds/environement/aviary.mp3" preload="auto"
    loop="true" volume="1"></audio>

  <!-- Sounds -->
  <a-asset-item id="edmon-ambiant-1" src="/assets/sounds/ptero/ambiant-dinos-1.mp3" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->
  <img id="center-asset" src="/assets/images/center.png" />
  <img id="loading-asset" src="/assets/images/loader.png" />
  <img id="credits-asset" src="/assets/images/credits.png" />
  <img id="rendering-asset" src="/assets/images/rendering.png" />
  <img id="dont-touch-asset" src="/assets/images/dont-touch.jpg" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg" />

  <!-- 3D -->
  <!-- Objects -->
  <a-asset-item id="edmon-scene-asset" src="/assets/models/objects/viewing-gallery/scene.glb">
  </a-asset-item>
  <a-asset-item id="window-asset" src="/assets/models/objects/window/scene.glb">
  </a-asset-item>
  <a-asset-item id="window-support-asset" src="/assets/models/objects/window-support/scene.glb">
  </a-asset-item>
  <a-asset-item id="wall-asset" src="/assets/models/objects/door-2/scene.gltf">
  </a-asset-item>
  <a-asset-item id="terminal-asset" src="/assets/models/objects/terminal/scene.gltf">
  </a-asset-item>
  <a-asset-item id="door-asset" src="/assets/models/objects/door-underwater/scene.glb">
  </a-asset-item>
  <a-asset-item id="floor-asset" src="/assets/models/objects/floor/scene.gltf">
  </a-asset-item>

  <!-- Environment -->
  <a-asset-item id="waterfall-asset" src="/assets/models/environment/waterfall/scene.gltf">
  </a-asset-item>
  <a-asset-item id="snow-rock-1-asset" src="/assets/models/environment/snow/snow-rock-1/scene.gltf">
  </a-asset-item>
  <a-asset-item id="snow-rock-2-asset" src="/assets/models/environment/snow/snow-rock-2/scene.gltf">
  </a-asset-item>
  <a-asset-item id="snow-scene-1-asset" src="/assets/models/environment/snow/snow-scene-1/scene.glb">
  </a-asset-item>


  <!-- Dinosaurs -->
  <a-asset-item id="edmon-male-asset" src="/assets/models/dinosaurs/edmon-male/edmontosaurus.glb">
  </a-asset-item>
  <a-asset-item id="edmon-female-asset" src="/assets/models/dinosaurs/edmon-female/edmontosaurus.glb">
  </a-asset-item>

  <!-- Images -->
  <img id="edmon-pres-asset" src="/assets/images/spino-pres.png" />

</a-assets>
