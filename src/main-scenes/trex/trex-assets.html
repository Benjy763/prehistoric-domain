<a-assets id="trex-assets" timeout="60000">
  <!-- Audio -->
  <audio id="voice-trex-sound-en" response-type="arraybuffer"
    src="/assets/sounds/voice/en/trex.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>
  <audio id="voice-trex-sound-fr" response-type="arraybuffer"
    src="/assets/sounds/voice/fr/trex.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" volume="1"></audio>

  <!-- Environement -->
  <audio id="jungle-asset" response-type="arraybuffer"
    src="/assets/sounds/environement/hights.webm?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto" loop="true"
    volume="1"></audio>

  <!-- Trex -->
  <audio id="sound-mixing-1" response-type="arraybuffer" crossorigin="anonymous"
    src="/assets/sounds/trex/sound-mixing-1.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    volume="1"></audio>
  <a-asset-item id="trex-roar" src="/assets/sounds/trex/roar.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}" preload="auto"
    response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="trex-roar2" src="/assets/sounds/trex/roar2.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="trex-foot-step" src="/assets/sounds/trex/foot-step.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="trex-drink" src="/assets/sounds/trex/drink.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="trex-leaves" src="/assets/sounds/trex/leaves.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="trex-hitting" src="/assets/sounds/trex/hitting.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
  <a-asset-item id="trex-end-snoring" src="/assets/sounds/trex/end-snoring.mp3?lastmod=${process.env.UNIQUE_ASSETS_ID}"
    preload="auto" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

  <!-- Images -->


  <img id="loading-asset" src="/assets/images/loader.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="limits-asset" src="/assets/images/limits.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="credits-asset" src="/assets/images/credits.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="rendering-asset" src="/assets/images/rendering.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="ground-texture-grass-asset" src="/assets/images/floor-grass.jpg?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="trex-pres-asset" material="shader: flat;encoding: sRGBEncoding;"
    src="/assets/images/trex-pres.png?lastmod=${process.env.UNIQUE_ASSETS_ID}" />
  <img id="trex-360-asset" src="/assets/images/trex/360-skybox-min.jpg?lastmod=${process.env.UNIQUE_ASSETS_ID}" />

  </img>

  <!-- 3D -->
  <!-- Objects -->
