<html>
  <head>
    <title>Jurassic Tour</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300&display=swap"
      rel="stylesheet"
    />
    <script src="build/build.js"></script>
    <style type="text/css">
      @font-face {
        font-family: 'Tribeca';
        src: url('./build/font/Tribeca.ttf') format('truetype');
      }
      body {
        font-family: 'Tribeca', Verdana, Tahoma;
      }
    </style>
  </head>
  <body>
    <!-- Website assets -->
    <audio
      id="turnon-sound"
      response-type="arraybuffer"
      src="./build/sounds/website/turnon.mp3"
      preload="auto"
      volume="1"
    ></audio>
    <audio
      id="runpc-sound"
      response-type="arraybuffer"
      src="./build/sounds/website/runpc.mp3"
      preload="auto"
      volume="1"
      loop="true"
    ></audio>
    <audio
      id="trex-sound"
      response-type="arraybuffer"
      src="./build/sounds/website/trex.mp3"
      preload="auto"
      volume="1"
      loop="true"
    ></audio>
    <audio
      id="soundtrack-sound"
      response-type="arraybuffer"
      src="./build/sounds/website/soundtrack.mp3"
      preload="auto"
      volume="1"
      loop="true"
    ></audio>
    <div id="app"></div>
  </body>
</html>
